<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>버섯동산의 비밀 — 탄성력</title>
<style>
  :root{
    --sky1:#bfe9ff; --sky2:#e8f8ff;
    --grass:#7ac943; --grass2:#5aa82f;
    --ink:#2c2118; --paper:#fffaf0;
    --orange:#ff9a3c; --orange2:#f27c16; --orangeDark:#c85c06;
    --cream:#fff3dd;
    --accent:#2f80ed; --good:#2fa84f; --bad:#e04f4f;
    --panel:#fffdf7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    background:#0d1b12;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ---------- 공통 버튼 ---------- */
  .btn{
    border:none; border-radius:14px; padding:12px 20px;
    font-size:16px; font-weight:800; font-family:inherit;
    background:var(--orange); color:#fff; cursor:pointer;
    box-shadow:0 4px 0 var(--orangeDark); transition:transform .06s, box-shadow .06s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--orangeDark);}
  .btn.blue{background:var(--accent); box-shadow:0 4px 0 #1b5bb5;}
  .btn.blue:active{box-shadow:0 1px 0 #1b5bb5;}
  .btn.grey{background:#9aa5b1; box-shadow:0 4px 0 #6b7580;}
  .btn.grey:active{box-shadow:0 1px 0 #6b7580;}
  .btn.green{background:var(--good); box-shadow:0 4px 0 #1e7536;}
  .btn.green:active{box-shadow:0 1px 0 #1e7536;}
  .btn:disabled{background:#cfd6dd; box-shadow:0 4px 0 #aab3bb; color:#8c949c; cursor:default;}
  .btn.sm{padding:8px 14px; font-size:14px; border-radius:11px;}

  /* ---------- 타이틀 ---------- */
  #title{
    position:absolute; inset:0; z-index:60;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px;
    background:radial-gradient(120% 90% at 50% 20%, #d9f2ff 0%, #a9e0ff 45%, #7ec9a0 100%);
    overflow:hidden;
  }
  #titleCanvas{position:absolute; inset:0; width:100%; height:100%;}
  #titleInner{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:420px;}
  #titleInner h1{
    margin:0; font-size:clamp(28px,7vw,44px); font-weight:900; letter-spacing:-1px;
    color:#fff; text-shadow:0 3px 0 var(--orangeDark), 0 6px 14px rgba(0,0,0,.25);
  }
  #titleInner .sub{
    font-size:15px; font-weight:700; color:#fff;
    background:rgba(44,33,24,.45); padding:6px 14px; border-radius:99px;
  }
  #nameBox{
    width:100%; background:var(--panel); border-radius:20px; padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.2); display:flex; flex-direction:column; gap:10px;
  }
  #nameBox label{font-size:14px; font-weight:800; color:#6b5a48;}
  #nick{
    width:100%; padding:14px; font-size:18px; font-weight:800; font-family:inherit;
    border:3px solid #ffd9a8; border-radius:14px; outline:none; text-align:center;
    background:#fffdf5; color:var(--ink);
  }
  #nick:focus{border-color:var(--orange);}
  #nameErr{font-size:13px; color:var(--bad); font-weight:700; min-height:16px; text-align:center;}

  /* ---------- 상단 바 ---------- */
  #topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:8px 10px; background:rgba(28,40,32,.92); color:#fff; z-index:20;
  }
  #topbar .who{font-size:14px; font-weight:800; white-space:nowrap;}
  #topbar .who b{color:#ffd08a;}
  #chapPill{
    font-size:13px; font-weight:800; background:rgba(255,255,255,.16);
    padding:5px 12px; border-radius:99px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; text-align:center;
  }
  .iconbtn{
    border:none; background:rgba(255,255,255,.16); color:#fff;
    width:36px; height:36px; border-radius:11px; font-size:17px; cursor:pointer; flex:0 0 auto;
  }
  .iconbtn:active{background:rgba(255,255,255,.34);}

  /* ---------- 월드 ---------- */
  #world{flex:1 1 auto; position:relative; min-height:0;}
  #gameCanvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block;}
  #hud{position:absolute; inset:0; pointer-events:none;}

  #moveL,#moveR{
    position:absolute; bottom:14px; width:68px; height:68px; border-radius:50%;
    background:rgba(255,255,255,.55); border:3px solid rgba(255,255,255,.85);
    color:#2c2118; font-size:26px; font-weight:900; pointer-events:auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
  }
  #moveL{left:14px;} #moveR{left:92px;}
  #moveL:active,#moveR:active{background:rgba(255,255,255,.9);}
  #talkBtn{
    position:absolute; bottom:22px; right:16px; pointer-events:auto;
    display:none; animation:pop .25s ease-out;
  }
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  #guideTip{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(28,40,32,.86); color:#fff; font-size:13px; font-weight:700;
    padding:7px 16px; border-radius:99px; white-space:nowrap; max-width:92%;
    overflow:hidden; text-overflow:ellipsis;
  }

  /* ---------- 대화창 ---------- */
  #dlg{
    position:absolute; left:0; right:0; bottom:0; z-index:30;
    padding:10px; display:none;
  }
  #dlgInner{
    max-width:760px; margin:0 auto; background:var(--panel);
    border-radius:20px; border:4px solid var(--orange);
    box-shadow:0 -6px 28px rgba(0,0,0,.28); padding:14px 16px 12px;
  }
  #dlgName{
    display:inline-block; font-size:14px; font-weight:900; color:#fff;
    background:var(--orange2); padding:4px 14px; border-radius:99px; margin-bottom:8px;
  }
  #dlgText{font-size:17px; line-height:1.6; font-weight:600; min-height:78px; white-space:pre-wrap;}
  #dlgText b{color:var(--orange2);}
  #dlgText .hl{background:linear-gradient(transparent 58%, #ffe08a 58%); font-weight:900;}
  #dlgFoot{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:8px;}
  #dlgHint{font-size:12px; color:#9a8b7a; font-weight:700; margin-right:auto;}

  /* ---------- 오버레이(활동) ---------- */
  #overlay{
    position:absolute; inset:0; z-index:40; display:none;
    background:rgba(20,28,22,.78); padding:10px;
    overflow:auto; -webkit-overflow-scrolling:touch; touch-action:auto;
  }
  #ovCard{
    max-width:860px; margin:0 auto; background:var(--panel);
    border-radius:22px; box-shadow:0 14px 40px rgba(0,0,0,.4);
    overflow:hidden; border:3px solid #ffd9a8;
  }
  #ovHead{
    background:linear-gradient(135deg,var(--orange),var(--orange2));
    color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px;
  }
  #ovHead h2{margin:0; font-size:18px; font-weight:900; flex:1;}
  #ovBody{padding:14px 16px 18px;}
  .ovClose{border:none; background:rgba(0,0,0,.2); color:#fff; width:32px; height:32px; border-radius:9px; font-size:16px; cursor:pointer;}

  .q{font-size:16px; font-weight:800; line-height:1.55; margin:0 0 10px;}
  .note{font-size:13.5px; line-height:1.6; color:#6b5a48; font-weight:600;}
  .card{background:#fff; border:2px solid #f0e2cb; border-radius:14px; padding:12px; margin:10px 0;}
  .card h3{margin:0 0 8px; font-size:15px; font-weight:900; color:var(--orange2);}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .fb{font-size:14.5px; font-weight:800; margin-top:8px; line-height:1.55;}
  .fb.ok{color:var(--good);} .fb.no{color:var(--bad);}

  .choice{
    display:block; width:100%; text-align:left; margin:6px 0; padding:12px 14px;
    font-size:15.5px; font-weight:700; font-family:inherit; line-height:1.45;
    border:2.5px solid #e6d8c2; border-radius:13px; background:#fff; color:var(--ink); cursor:pointer;
  }
  .choice:active{background:#fff5e2;}
  .choice.sel{border-color:var(--accent); background:#eaf2ff;}
  .choice.ok{border-color:var(--good); background:#e9f8ee;}
  .choice.no{border-color:var(--bad); background:#fdecec;}
  .choice:disabled{cursor:default;}

  input.num{
    width:88px; padding:10px; font-size:17px; font-weight:800; font-family:inherit;
    text-align:center; border:2.5px solid #e6d8c2; border-radius:11px; background:#fff; color:var(--ink);
  }
  input.num:focus{outline:none; border-color:var(--accent);}

  /* 실험 표 */
  table.dt{width:100%; border-collapse:collapse; font-size:13.5px; font-weight:700;}
  table.dt th,table.dt td{border:1.5px solid #e2d3bb; padding:6px 3px; text-align:center;}
  table.dt th{background:#fff1da; color:#8a6a3c; font-weight:900;}
  table.dt td.avg{background:#eaf2ff; color:#1b5bb5; font-weight:900;}
  table.dt td.on{background:#fff8e6;}
  table.dt .lbl{background:#fbf3e6; font-weight:900; width:56px;}

  /* 진도(챕터) 목록 */
  #chapList{position:absolute; inset:0; z-index:50; display:none; background:rgba(20,28,22,.8); padding:12px; overflow:auto; touch-action:auto;}
  #chapCard{max-width:520px; margin:0 auto; background:var(--panel); border-radius:20px; padding:14px; box-shadow:0 14px 40px rgba(0,0,0,.4);}
  #chapCard h2{margin:2px 0 10px; font-size:18px; font-weight:900;}
  .chapItem{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 12px; margin:6px 0; border-radius:13px; border:2.5px solid #e6d8c2;
    background:#fff; font-family:inherit; font-size:15px; font-weight:800; color:var(--ink); cursor:pointer;
  }
  .chapItem .n{width:26px; height:26px; border-radius:50%; background:#ffe0b8; color:#8a5a12; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .chapItem.done{background:#eefaf1; border-color:#b9e5c6;}
  .chapItem.done .n{background:var(--good); color:#fff;}
  .chapItem.cur{border-color:var(--orange); background:#fff6e8;}
  .chapItem.lock{opacity:.5;}

  /* 정리 노트 */
  .sumbox{background:#fffbef; border:2.5px dashed var(--orange); border-radius:16px; padding:12px 14px; margin:10px 0;}
  .sumbox h3{margin:0 0 6px; font-size:15px; color:var(--orange2); font-weight:900;}
  .sumbox ul{margin:0; padding-left:20px;}
  .sumbox li{font-size:14.5px; font-weight:700; line-height:1.7;}

  canvas.mini{width:100%; display:block; border-radius:12px; background:#fff; border:2px solid #f0e2cb; touch-action:none;}

  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:rgba(28,40,32,.94); color:#fff; font-size:14.5px; font-weight:800;
    padding:10px 20px; border-radius:99px; z-index:90; pointer-events:none;
    opacity:0; transition:opacity .2s; max-width:90%; text-align:center;
  }
  .toast.on{opacity:1;}

  @media (max-width:420px){
    #dlgText{font-size:15.5px; min-height:70px;}
    #moveL,#moveR{width:60px; height:60px;}
    #moveR{left:82px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- 상단 바 -->
  <div id="topbar">
    <div class="who">🍄 <b id="whoName">탐험가</b></div>
    <div id="chapPill">프롤로그</div>
    <button class="iconbtn" id="btnChap" title="진도">📖</button>
    <button class="iconbtn" id="btnNote" title="정리 노트">📝</button>
  </div>

  <!-- 월드 -->
  <div id="world">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div id="guideTip">화살표로 움직여 버섯에게 말을 걸어 보자</div>
      <div id="moveL">◀</div>
      <div id="moveR">▶</div>
      <button class="btn" id="talkBtn">💬 말 걸기</button>
    </div>

    <!-- 대화창 -->
    <div id="dlg">
      <div id="dlgInner">
        <span id="dlgName">말랑이</span>
        <div id="dlgText"></div>
        <div id="dlgFoot">
          <span id="dlgHint">탭하면 다음</span>
          <button class="btn sm grey" id="dlgSkip">건너뛰기</button>
          <button class="btn sm" id="dlgNext">다음 ▶</button>
        </div>
      </div>
    </div>

    <!-- 활동 오버레이 -->
    <div id="overlay">
      <div id="ovCard">
        <div id="ovHead"><h2 id="ovTitle">활동</h2><button class="ovClose" id="ovClose">✕</button></div>
        <div id="ovBody"></div>
      </div>
    </div>

    <!-- 진도 -->
    <div id="chapList">
      <div id="chapCard">
        <h2>📖 오늘의 진도</h2>
        <div id="chapItems"></div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn sm grey" id="chapTeacher" style="flex:0 0 auto;">🔑 선생님</button>
          <button class="btn sm blue" id="chapClose" style="flex:1;">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 타이틀 -->
  <div id="title">
    <canvas id="titleCanvas"></canvas>
    <div id="titleInner">
      <h1>버섯동산의 비밀</h1>
      <div class="sub">중1 과학 · Ⅴ. 힘의 작용 — 탄성력</div>
      <div id="nameBox">
        <label for="nick">탐험가 이름을 정해 줘 (닉네임)</label>
        <input id="nick" maxlength="8" placeholder="예) 문쌤, 지민, 버섯왕" autocomplete="off">
        <div id="nameErr"></div>
        <button class="btn" id="startBtn" style="width:100%;">🍄 버섯동산으로 출발!</button>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ============================================================
   버섯동산의 비밀 — 탄성력 학습 웹앱
   중1 과학 Ⅴ. 힘의 작용 / 03 탄성력 (교과서 160~163쪽)
   단일 HTML · 외부 라이브러리 없음 · 오프라인 동작
   ============================================================ */

/* ---------- 전역 상태 ---------- */
const G = {
  nick: "탐험가",
  chapter: 0,          // 0 = 프롤로그, 1~7
  done: [false,false,false,false,false,false,false,false], // done[1..7]
  teacher: false,
  notes: [],           // 정리 노트에 쌓이는 문장
  exp: null            // 5장 실험 데이터
};

const CHAPTERS = [
  { n:0, title:"프롤로그 — 버섯동산 도착" },
  { n:1, title:"1장 · 탄성이란 무엇일까?" },
  { n:2, title:"2장 · 탄성력의 방향" },
  { n:3, title:"3장 · 탄성력의 크기" },
  { n:4, title:"4장 · 탄성 한계" },
  { n:5, title:"5장 · [탐구] 용수철의 탄성력 측정" },
  { n:6, title:"6장 · 그래프로 나타내기" },
  { n:7, title:"7장 · 용수철저울의 원리" }
];

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const cvs = $("gameCanvas"), ctx = cvs.getContext("2d");
const tcvs = $("titleCanvas"), tctx = tcvs.getContext("2d");

/* ---------- 저장 (실패해도 무시) ---------- */
function save(){
  try{ localStorage.setItem("mushroomElastic", JSON.stringify({nick:G.nick, chapter:G.chapter, done:G.done, notes:G.notes})); }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem("mushroomElastic")||"null");
    if(s && s.nick){ return s; }
  }catch(e){}
  return null;
}

/* ---------- 토스트 ---------- */
let toastTimer = null;
function toast(msg, ms){
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("on"), ms||1800);
}

/* ============================================================
   그리기 도우미
   ============================================================ */
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

/* ---------- 버섯 갓 모양 ---------- */
const CAPSHAPE = {
  round:{rx:1.00, ry:1.00},
  flat: {rx:1.28, ry:0.72},
  tall: {rx:0.86, ry:1.34},
  wavy: {rx:1.12, ry:0.94}
};

/* 버섯의 전체 높이 (발바닥 → 갓 꼭대기) */
function mushH(size, squash, opt){
  squash = Math.max(0.18, squash);
  const cs = CAPSHAPE[(opt && opt.cap) || "round"];
  return size*0.46*squash + size*0.42*cs.ry*squash*1.25;
}

/* 갓 외곽선 경로 */
function capPath(c, x, capCY, capRX, capRY, shape){
  c.beginPath();
  c.ellipse(x, capCY, capRX, capRY, 0, Math.PI, 0);
  if(shape === "wavy"){
    for(let i=0;i<=44;i++){
      const u = i/44;
      const px = x + capRX*(1-2*u);
      const py = capCY + capRY*0.40*Math.sin(Math.PI*u) + capRY*0.15*Math.sin(u*Math.PI*7);
      c.lineTo(px, py);
    }
  } else {
    c.ellipse(x, capCY, capRX, capRY*0.42, 0, 0, Math.PI);
  }
  c.closePath();
}

/* 버섯 그리기.
   squash : 1 = 원래 모양, 0.4 = 납작하게 눌림
   mood   : happy | excited | wink | grumpy | calm | wise | sad | surprised | flat | none
   opt    : {cap:round|flat|tall|wavy, spots:dots|bigdots|stripes|none, spotCol, acc:beard|glasses|pencil|leaf} */
function drawMushroom(c, x, y, size, squash, mood, tint, stemTint, opt){
  opt = opt || {};
  squash = Math.max(0.18, squash);
  const s = size;
  const cs = CAPSHAPE[opt.cap || "round"];
  const spread = 1 + (1-squash)*0.55;
  const capRX = s*0.50*cs.rx*spread;
  const capRY = s*0.42*cs.ry*squash;
  const stemH = s*0.46*squash;
  const stemW = s*0.42*(1 + (1-squash)*0.40);
  const base  = y;
  const capCY = base - stemH - capRY*0.25;

  c.save();
  // 그림자
  c.fillStyle = "rgba(0,0,0,.16)";
  c.beginPath(); c.ellipse(x, base+3, capRX*0.95, s*0.085, 0, 0, Math.PI*2); c.fill();

  // 기둥
  const g = c.createLinearGradient(x-stemW/2, 0, x+stemW/2, 0);
  const t1 = stemTint ? stemTint[0] : "#fff0d6", t2 = stemTint ? stemTint[1] : "#fffaf0", t3 = stemTint ? stemTint[2] : "#f3ddbb";
  g.addColorStop(0,t1); g.addColorStop(.5,t2); g.addColorStop(1,t3);
  c.fillStyle = g;
  rr(c, x-stemW/2, base-stemH, stemW, stemH+2, Math.min(stemW*0.38, stemH*0.45));
  c.fill();

  // 갓
  const cg = c.createLinearGradient(x, capCY-capRY, x, capCY+capRY*0.5);
  cg.addColorStop(0, tint ? tint[0] : "#ffa64d");
  cg.addColorStop(1, tint ? tint[1] : "#e8730c");
  c.fillStyle = cg;
  capPath(c, x, capCY, capRX, capRY, opt.cap);
  c.fill();

  // 갓 무늬
  const sp = opt.spots === undefined ? "dots" : opt.spots;
  if(sp !== "none"){
    c.save();
    capPath(c, x, capCY, capRX, capRY, opt.cap); c.clip();
    c.fillStyle = opt.spotCol || "rgba(255,247,230,.88)";
    if(sp === "stripes"){
      c.globalAlpha = 0.5;
      for(let i=-3;i<=3;i++){
        c.beginPath();
        c.ellipse(x + capRX*i*0.28, capCY, capRX*0.065, capRY*1.35, 0, 0, Math.PI*2);
        c.fill();
      }
    } else if(sp === "bigdots"){
      for(const d of [[-0.40,-0.40,0.22],[0.30,-0.52,0.17],[0.52,0.02,0.14]]){
        c.beginPath(); c.ellipse(x+capRX*d[0], capCY+capRY*d[1], capRX*d[2], capRY*d[2]*1.1, 0, 0, Math.PI*2); c.fill();
      }
    } else {
      for(const d of [[-0.34,-0.46,0.15],[0.26,-0.54,0.11],[0.46,-0.12,0.095],[-0.54,-0.08,0.085]]){
        c.beginPath(); c.ellipse(x+capRX*d[0], capCY+capRY*d[1], capRX*d[2], capRY*d[2]*1.05, 0, 0, Math.PI*2); c.fill();
      }
    }
    c.restore();
  }

  if(mood === "none"){ c.restore(); return; }

  /* ---------- 얼굴 ---------- */
  const fy = base - stemH*0.55;
  const eyeDX = stemW*0.26, eyeR = Math.max(1.6, s*0.042);
  const ink = "#4a3320";
  c.fillStyle = ink; c.strokeStyle = ink; c.lineCap = "round";
  const lw = Math.max(1.5, s*0.038);

  function dot(dx, r){ c.beginPath(); c.arc(x+dx, fy, r, 0, Math.PI*2); c.fill(); }
  function line(dx, w2){ c.lineWidth = lw; c.beginPath(); c.moveTo(x+dx-w2, fy); c.lineTo(x+dx+w2, fy); c.stroke(); }
  function arcEye(dx, r){ c.lineWidth = lw; c.beginPath(); c.arc(x+dx, fy+r*0.3, r, Math.PI*1.12, Math.PI*1.88); c.stroke(); }

  if(mood === "flat"){ line(-eyeDX, eyeR); line(eyeDX, eyeR); }
  else if(mood === "surprised"){
    c.beginPath(); c.ellipse(x-eyeDX, fy, eyeR*0.85, eyeR*1.4, 0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(x+eyeDX, fy, eyeR*0.85, eyeR*1.4, 0, 0, Math.PI*2); c.fill();
  }
  else if(mood === "excited"){ dot(-eyeDX, eyeR*1.25); dot(eyeDX, eyeR*1.25); }
  else if(mood === "wink"){ dot(-eyeDX, eyeR); arcEye(eyeDX, eyeR*1.1); }
  else if(mood === "wise"){ arcEye(-eyeDX, eyeR*1.05); arcEye(eyeDX, eyeR*1.05); }
  else if(mood === "calm"){ dot(-eyeDX, eyeR*0.82); dot(eyeDX, eyeR*0.82); }
  else { dot(-eyeDX, eyeR); dot(eyeDX, eyeR); }

  // 눈썹
  if(mood === "grumpy" || mood === "wise"){
    c.lineWidth = lw*0.95;
    const by = fy - eyeR*2.3, tilt = mood === "grumpy" ? eyeR*0.8 : eyeR*0.25;
    c.beginPath(); c.moveTo(x-eyeDX-eyeR*1.4, by-tilt); c.lineTo(x-eyeDX+eyeR*1.2, by+tilt*0.5); c.stroke();
    c.beginPath(); c.moveTo(x+eyeDX+eyeR*1.4, by-tilt); c.lineTo(x+eyeDX-eyeR*1.2, by+tilt*0.5); c.stroke();
  }

  // 입
  c.lineWidth = Math.max(1.3, s*0.033);
  const my = fy + s*0.10;
  c.beginPath();
  if(mood === "sad")            c.arc(x, my+s*0.07, s*0.075, Math.PI*1.15, Math.PI*1.85);
  else if(mood === "grumpy")    { c.moveTo(x-s*0.055, my); c.lineTo(x+s*0.055, my-s*0.012); }
  else if(mood === "surprised") c.ellipse(x, my, s*0.045, s*0.06, 0, 0, Math.PI*2);
  else if(mood === "excited")   { c.ellipse(x, my-s*0.012, s*0.062, s*0.05, 0, 0, Math.PI); c.closePath(); c.fillStyle=ink; c.fill(); }
  else if(mood === "wise")      c.arc(x, my-s*0.04, s*0.06, Math.PI*0.22, Math.PI*0.78);
  else                          c.arc(x, my-s*0.03, s*0.075, Math.PI*0.18, Math.PI*0.82);
  c.stroke();

  // 볼터치
  if(mood !== "grumpy" && mood !== "wise"){
    c.fillStyle = "rgba(255,140,110,.30)";
    c.beginPath(); c.ellipse(x-stemW*0.42, fy+s*0.07, s*0.055, s*0.035, 0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(x+stemW*0.42, fy+s*0.07, s*0.055, s*0.035, 0, 0, Math.PI*2); c.fill();
  }

  /* ---------- 소품 ---------- */
  if(opt.acc === "beard"){
    c.fillStyle = "#eae5da"; c.strokeStyle = "#b9ae9c"; c.lineWidth = Math.max(1, s*0.016);
    c.beginPath();
    c.moveTo(x-stemW*0.40, my+s*0.01);
    c.quadraticCurveTo(x-stemW*0.34, base+s*0.05, x, base+s*0.04);
    c.quadraticCurveTo(x+stemW*0.34, base+s*0.05, x+stemW*0.40, my+s*0.01);
    c.quadraticCurveTo(x, my+s*0.06, x-stemW*0.40, my+s*0.01);
    c.closePath(); c.fill(); c.stroke();
  }
  if(opt.acc === "glasses"){
    c.strokeStyle = "#3d3a35"; c.lineWidth = Math.max(1.3, s*0.028);
    c.beginPath(); c.arc(x-eyeDX, fy, eyeR*2.0, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.arc(x+eyeDX, fy, eyeR*2.0, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.moveTo(x-eyeDX+eyeR*2.0, fy); c.lineTo(x+eyeDX-eyeR*2.0, fy); c.stroke();
    c.fillStyle = "rgba(200,230,255,.28)";
    c.beginPath(); c.arc(x-eyeDX, fy, eyeR*2.0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(x+eyeDX, fy, eyeR*2.0, 0, Math.PI*2); c.fill();
  }
  if(opt.acc === "pencil"){
    c.save(); c.translate(x+capRX*0.66, capCY-capRY*0.15); c.rotate(-0.5);
    c.fillStyle="#ffcf3f"; rr(c, -s*0.028, -s*0.27, s*0.056, s*0.30, s*0.012); c.fill();
    c.fillStyle="#f2d6ae"; c.beginPath(); c.moveTo(-s*0.028,-s*0.27); c.lineTo(s*0.028,-s*0.27); c.lineTo(0,-s*0.34); c.closePath(); c.fill();
    c.fillStyle="#4a3320"; c.beginPath(); c.moveTo(-s*0.011,-s*0.305); c.lineTo(s*0.011,-s*0.305); c.lineTo(0,-s*0.34); c.closePath(); c.fill();
    c.fillStyle="#ff8b8b"; rr(c, -s*0.028, s*0.005, s*0.056, s*0.045, s*0.012); c.fill();
    c.restore();
  }
  if(opt.acc === "leaf"){
    c.save(); c.translate(x + capRX*0.10, capCY - capRY*0.98); c.rotate(-0.35);
    const lg = c.createLinearGradient(0,0,s*0.30,0);
    lg.addColorStop(0,"#7fd05a"); lg.addColorStop(1,"#3f9a2c");
    c.fillStyle = lg;
    c.beginPath(); c.moveTo(0,0);
    c.quadraticCurveTo(s*0.16,-s*0.13, s*0.30,0);
    c.quadraticCurveTo(s*0.16, s*0.10, 0,0);
    c.closePath(); c.fill();
    c.strokeStyle="rgba(255,255,255,.55)"; c.lineWidth=Math.max(1,s*0.014);
    c.beginPath(); c.moveTo(s*0.02,0); c.lineTo(s*0.27,0); c.stroke();
    c.restore();
  }
  c.restore();
}

/* 플레이어(탐험가) */
function drawPlayer(c, x, base, s, t, walking, facing){
  const sw = walking ? Math.sin(t*0.014)*1 : 0;
  const legSwing = walking ? Math.sin(t*0.014)*s*0.16 : 0;
  const bob = walking ? Math.abs(Math.sin(t*0.014))*s*0.045 : Math.sin(t*0.003)*s*0.018;
  const y = base - bob;
  c.save();
  c.fillStyle = "rgba(0,0,0,.16)";
  c.beginPath(); c.ellipse(x, base+3, s*0.30, s*0.085, 0, 0, Math.PI*2); c.fill();

  // 다리
  c.strokeStyle="#3b4a66"; c.lineWidth=s*0.10; c.lineCap="round";
  c.beginPath(); c.moveTo(x-s*0.09, y-s*0.44); c.lineTo(x-s*0.09+legSwing, y-s*0.02); c.stroke();
  c.beginPath(); c.moveTo(x+s*0.09, y-s*0.44); c.lineTo(x+s*0.09-legSwing, y-s*0.02); c.stroke();
  // 몸
  const bg = c.createLinearGradient(x, y-s*0.95, x, y-s*0.40);
  bg.addColorStop(0,"#57b8ff"); bg.addColorStop(1,"#2f80ed");
  c.fillStyle = bg;
  rr(c, x-s*0.20, y-s*0.92, s*0.40, s*0.52, s*0.13); c.fill();
  // 팔
  c.strokeStyle="#2f80ed"; c.lineWidth=s*0.085;
  c.beginPath(); c.moveTo(x-s*0.19, y-s*0.82); c.lineTo(x-s*0.30, y-s*0.55-legSwing*0.5); c.stroke();
  c.beginPath(); c.moveTo(x+s*0.19, y-s*0.82); c.lineTo(x+s*0.30, y-s*0.55+legSwing*0.5); c.stroke();
  // 머리
  c.fillStyle="#ffe0bd";
  c.beginPath(); c.arc(x, y-s*1.08, s*0.21, 0, Math.PI*2); c.fill();
  // 머리카락
  c.fillStyle="#3a2a1c";
  c.beginPath(); c.arc(x, y-s*1.13, s*0.215, Math.PI*1.02, Math.PI*2.02); c.fill();
  c.beginPath(); c.ellipse(x+facing*s*0.09, y-s*1.19, s*0.15, s*0.075, 0, 0, Math.PI*2); c.fill();
  // 눈
  c.fillStyle="#2c2118";
  c.beginPath(); c.arc(x+facing*s*0.055-s*0.05, y-s*1.06, s*0.026, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+facing*s*0.055+s*0.05, y-s*1.06, s*0.026, 0, Math.PI*2); c.fill();
  c.restore();
  return sw;
}

/* 이름표 */
function nameTag(c, x, y, text, bg, fg){
  c.save();
  c.font = "900 13px system-ui, sans-serif";
  const w = c.measureText(text).width + 16;
  c.fillStyle = bg || "rgba(28,40,32,.82)";
  rr(c, x-w/2, y-18, w, 20, 10); c.fill();
  c.fillStyle = fg || "#fff"; c.textAlign="center"; c.textBaseline="middle";
  c.fillText(text, x, y-8);
  c.restore();
}

const NPCS = [

    opt:{cap:"flat",  spots:"bigdots", face:"excited"} },
  { id:"tangle",  x:1380, name:"탱글",     ch:3, tint:["#ff6a52","#d6301f"], stem:["#ffe9d6","#fff6ea","#f2d5bb"],
    opt:{cap:"tall",  spots:"stripes", face:"wink"} },

  { id:"elder",   x:3320, name:"탄성 장로", ch:7, tint:["#ffe08a","#d99a1e"], stem:["#f5f1e6","#fbf8f0","#e3dccc"],
    opt:{cap:"wavy",  spots:"dots",    face:"wise",   acc:"leaf"} }
];

const W = {
  camX: 0, t: 0,
  player: { x: 140, vx: 0, facing: 1, walking: false },
  hold: 0,      // -1, 0, 1
  near: null,
  squash: {},   // npc별 눌림 애니메이션
  running: false
};
for(const n of NPCS) W.squash[n.id] = { v:1, target:1, timer:0 };

let VW = 0, VH = 0, DPR = 1, SC = 1;
function fitCanvas(c, cx){
  const r = c.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  cx.setTransform(dpr,0,0,dpr,0,0);
  return { w: r.width, h: r.height, dpr };
}

function drawBackdrop(c, w, h, camX, t){
  // 하늘
  const sky = c.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,"#9fdcff"); sky.addColorStop(.55,"#d6f1ff"); sky.addColorStop(1,"#eafaf0");
  c.fillStyle = sky; c.fillRect(0,0,w,h);

  // 해
  c.fillStyle="rgba(255,240,180,.85)";
  c.beginPath(); c.arc(w*0.84, h*0.14, h*0.065, 0, Math.PI*2); c.fill();
  c.fillStyle="rgba(255,240,180,.25)";
  c.beginPath(); c.arc(w*0.84, h*0.14, h*0.11, 0, Math.PI*2); c.fill();

  // 구름 (아주 느린 시차)
  c.fillStyle="rgba(255,255,255,.85)";
  for(let i=0;i<12;i++){
    const bx = ((i*380 + t*0.008) % (WORLD_W+800)) - camX*0.14;
    const by = h*(0.08 + (i%4)*0.085);
    const sz = h*(0.035 + (i%2)*0.014);
    c.beginPath();
    c.ellipse(bx, by, sz*2.0, sz, 0, 0, Math.PI*2);
    c.ellipse(bx-sz*1.3, by+sz*0.25, sz*1.2, sz*0.72, 0, 0, Math.PI*2);
    c.ellipse(bx+sz*1.4, by+sz*0.22, sz*1.3, sz*0.78, 0, 0, Math.PI*2);
    c.fill();
  }

  const gy = h * (h > w*1.15 ? 0.66 : 0.72);
  // 먼 언덕
  c.fillStyle="#a8d98a";
  c.beginPath(); c.moveTo(0,gy);
  for(let i=0;i<=w+18;i+=18){
    const ii = Math.min(i,w), wx = ii + camX*0.25;
    c.lineTo(ii, gy - 52 - Math.sin(wx*0.0034)*34 - Math.sin(wx*0.0011)*24);
  }
  c.lineTo(w,gy); c.closePath(); c.fill();

  // 먼 언덕 위의 작은 버섯 숲 (얼굴 없음)
  for(let i=0;i<20;i++){
    const wx = 150 + i*230;
    const sx = wx - camX*0.25;
    if(sx < -40 || sx > w+40) continue;
    const hy = gy - 52 - Math.sin((wx)*0.0034)*34 - Math.sin((wx)*0.0011)*24;
    drawMushroom(c, sx, hy+4, 13 + (i%3)*4, 1, "none", ["#cfe3b0","#a9c98a"], ["#dbe9c6","#e8f2da","#cddcb6"]);
  }

  // 중간 언덕
  c.fillStyle="#8ecb62";
  c.beginPath(); c.moveTo(0,gy);
  for(let i=0;i<=w+14;i+=14){
    const ii = Math.min(i,w), wx = ii + camX*0.5;
    c.lineTo(ii, gy - 26 - Math.sin(wx*0.0052+1.4)*22 - Math.sin(wx*0.0017)*14);
  }
  c.lineTo(w,gy); c.closePath(); c.fill();

  // 중경 버섯 (얼굴 없음)
  for(let i=0;i<16;i++){
    const wx = 240 + i*215;
    const sx = wx - camX*0.5;
    if(sx < -50 || sx > w+50) continue;
    const hy = gy - 26 - Math.sin(wx*0.0052+1.4)*22 - Math.sin(wx*0.0017)*14;
    drawMushroom(c, sx, hy+6, 20 + (i%3)*6, 1, "none", ["#f6c795","#dda468"], ["#e6e9c9","#f0f2dc","#d6dab6"]);
  }

  // 땅
  const gg = c.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,"#7ac943"); gg.addColorStop(.25,"#63ac33"); gg.addColorStop(1,"#4b8526");
  c.fillStyle = gg; c.fillRect(0, gy, w, h-gy);
  c.fillStyle="#8fd95a"; c.fillRect(0, gy, w, 5);

  // 풀 포기
  c.strokeStyle="rgba(40,100,25,.20)"; c.lineWidth=1.8; c.lineCap="round";
  for(let i=0;i<90;i++){
    const wx = i*46 + 15;
    const sx = wx - camX;
    if(sx<-20 || sx>w+20) continue;
    const by = gy + 10 + (i%5)*((h-gy)/6);
    const bend = Math.sin(t*0.0018 + i)*3;
    for(let k=-1;k<=1;k++){
      c.beginPath(); c.moveTo(sx+k*5, by);
      c.quadraticCurveTo(sx+k*5+bend, by-6, sx+k*6+bend*1.6, by-11);
      c.stroke();
    }
  }
  return gy;
}

/* 표지판 */
function signpost(c, x, gy, label, done){
  c.save();
  c.fillStyle="#a9743c";
  c.fillRect(x-3, gy-46, 6, 46);
  c.fillStyle = done ? "#5fbf74" : "#f0d29a";
  rr(c, x-34, gy-74, 68, 30, 7); c.fill();
  c.strokeStyle= done ? "#3d8f52" : "#c3a068"; c.lineWidth=2.5;
  rr(c, x-34, gy-74, 68, 30, 7); c.stroke();
  c.fillStyle= done ? "#fff" : "#7a5a28";
  c.font="900 13px system-ui, sans-serif"; c.textAlign="center"; c.textBaseline="middle";
  c.fillText(label, x, gy-59);
  c.restore();
}

function worldFrame(ts){
  if(!W.running) return;
  const f = fitCanvas(cvs, ctx);
  VW = f.w; VH = f.h;
  W.t = ts || 0;

  // 이동
  const sp = 3.6 * (VH/500);
  if(W.hold !== 0 && !dlgOpen && $("overlay").style.display !== "block"){
    W.player.x += W.hold * sp;
    W.player.facing = W.hold;
    W.player.walking = true;
  } else W.player.walking = false;
  W.player.x = Math.max(70, Math.min(WORLD_W-70, W.player.x));

  // 카메라
  const targetCam = Math.max(0, Math.min(WORLD_W - VW, W.player.x - VW*0.42));
  W.camX += (targetCam - W.camX) * 0.14;

  const gy = drawBackdrop(ctx, VW, VH, W.camX, W.t);
  const baseS = Math.max(40, Math.min(96, Math.min(VH*0.18, VW*0.175)));

  // NPC
  let near = null, nearD = 1e9;
  for(const n of NPCS){
    const sx = n.x - W.camX;
    const sq = W.squash[n.id];
    // 살짝 튕기는 숨쉬기
    const idle = 1 + Math.sin(W.t*0.0028 + n.x)*0.035;
    sq.v += (sq.target*idle - sq.v) * 0.18;
    if(sq.timer > 0){ sq.timer -= 16; if(sq.timer<=0) sq.target = 1; }

    const d = Math.abs(W.player.x - n.x);
    if(d < 120 && d < nearD){ near = n; nearD = d; }

    if(sx > -180 && sx < VW+180){
      const S = baseS*1.35;
      signpost(ctx, sx - S*0.78, gy, CHAPTERS[n.ch].n + "장", G.done[n.ch]);
      const unlocked = isUnlocked(n.ch);
      ctx.globalAlpha = unlocked ? 1 : 0.55;
      drawMushroom(ctx, sx, gy+6, S, sq.v, unlocked ? n.opt.face : "sad", n.tint, n.stem, n.opt);
      ctx.globalAlpha = 1;
      const topY = gy + 6 - mushH(S, sq.v, n.opt) - 8;
      nameTag(ctx, sx, topY,
        n.name + (G.done[n.ch] ? " ✅" : (unlocked ? "" : " 🔒")),
        G.done[n.ch] ? "rgba(47,168,79,.9)" : (unlocked ? "rgba(232,115,12,.92)" : "rgba(90,90,90,.8)"));
      // 말풍선 아이콘
      if(unlocked && !G.done[n.ch]){
        const by = topY - 26 + Math.sin(W.t*0.005)*3;
        ctx.fillStyle="#fff"; ctx.strokeStyle="#e8730c"; ctx.lineWidth=2;
        rr(ctx, sx-11, by-13, 22, 20, 6); ctx.fill(); ctx.stroke();
        ctx.fillStyle="#e8730c"; ctx.font="900 13px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText("!", sx, by-2);
      }
    }
  }

  // 플레이어
  const PS = baseS*1.18;
  drawPlayer(ctx, W.player.x - W.camX, gy+6, PS, W.t, W.player.walking, W.player.facing);
  nameTag(ctx, W.player.x - W.camX, gy+6 - PS*1.40, G.nick, "rgba(47,128,237,.92)");

  // 말 걸기 버튼
  W.near = near;
  const tb = $("talkBtn");
  if(near && !dlgOpen && $("overlay").style.display !== "block"){
    tb.style.display = "block";
    tb.textContent = "💬 " + near.name + "에게 말 걸기";
  } else tb.style.display = "none";

  requestAnimationFrame(worldFrame);
}

function isUnlocked(ch){
  if(G.teacher) return true;
  if(ch <= 1) return true;
  return G.done[ch-1] === true;
}

/* ============================================================
   대화 시스템

let dlgQueue = [], dlgOpen = false, dlgOnEnd = null, dlgTyping = null, dlgFull = "";

function say(lines, onEnd){
  dlgQueue = lines.slice();
  dlgOnEnd = onEnd || null;
  dlgOpen = true;
  $("dlg").style.display = "block";
  nextLine();
}
function nextLine(){
  if(dlgTyping){ clearInterval(dlgTyping); dlgTyping=null; $("dlgText").innerHTML = dlgFull; return; }
  if(dlgQueue.length === 0){
    dlgOpen = false; $("dlg").style.display = "none";
    const f = dlgOnEnd; dlgOnEnd = null;
    if(f) f();
    return;
  }
  const L = dlgQueue.shift();
  $("dlgName").textContent = L[0];
  dlgFull = L[1];
  const el = $("dlgText");
  el.innerHTML = "";
  // 타자 효과 (태그 안전하게: 일단 전체 넣고 잘라내기)
  const plain = dlgFull;
  let i = 0;
  dlgTyping = setInterval(()=>{
    i += 2;
    if(i >= plain.length){ el.innerHTML = plain; clearInterval(dlgTyping); dlgTyping=null; return; }
    let cut = plain.slice(0, i);
    const open = (cut.match(/</g)||[]).length, close = (cut.match(/>/g)||[]).length;
    if(open !== close) cut = cut.slice(0, cut.lastIndexOf("<"));
    el.innerHTML = cut;
  }, 14);
  $("dlgNext").textContent = dlgQueue.length ? "다음 ▶" : "확인";
}
$("dlgNext").onclick = nextLine;
$("dlgInner").onclick = e => { if(e.target.id !== "dlgNext" && e.target.id !== "dlgSkip") nextLine(); };
$("dlgSkip").onclick = () => {
  if(dlgTyping){ clearInterval(dlgTyping); dlgTyping=null; }
  dlgQueue = []; dlgOpen=false; $("dlg").style.display="none";
  const f = dlgOnEnd; dlgOnEnd=null; if(f) f();
};

function completeChapter(ch, noteLines){
  if(!G.done[ch]){
    G.done[ch] = true;
    if(noteLines) G.notes.push({ ch, lines: noteLines });
  }
  G.chapter = Math.max(G.chapter, ch);
  $("chapPill").textContent = CHAPTERS[Math.min(ch+1,7)].title;
  save();
}
function setTip(s){ $("guideTip").textContent = s; }
